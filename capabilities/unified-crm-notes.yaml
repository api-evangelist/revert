    resources:
    - path: /v1/crm/notes
      name: crm-notes
      description: REST surface for crm-notes.
      operations:
      - method: GET
        name: getcrmnotes
        description: List CRM Notes
        call: unified-crm-notes.getcrmnotes
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createcrmnote
        description: Create CRM Note
        call: unified-crm-notes.createcrmnote
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/crm/notes/{id}
