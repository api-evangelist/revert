    description: Revert Unified API — CRM Notes business capability. Self-contained, no shared references.
    resources:
    - name: crm-notes
      path: /crm/notes
      operations:
      - name: getcrmnotes
        method: GET
        description: List CRM Notes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createcrmnote
        method: POST
        description: Create CRM Note
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: crm-notes-id
      path: /crm/notes/{id}
      operations:
      - name: getcrmnote
        method: GET
        description: Get CRM Note
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
      - name: updatecrmnote
        method: PATCH
        description: Update CRM Note
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
