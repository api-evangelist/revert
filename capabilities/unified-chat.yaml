naftiko: 1.0.0-alpha2
info:
  label: Revert Unified API — Chat
  description: 'Revert Unified API — Chat. 3 operations. Lead operation: List Chat Channels. Self-contained Naftiko capability
    covering one Revert business surface.'
  tags:
  - Revert
  - Chat
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    REVERT_API_KEY: REVERT_API_KEY
capability:
  consumes:
  - type: http
    namespace: unified-chat
    baseUri: https://api.revert.dev
    description: Revert Unified API — Chat business capability. Self-contained, no shared references.
    resources:
    - name: chat-channels
      path: /chat/channels
      operations:
      - name: getchatchannels
        method: GET
        description: List Chat Channels
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: chat-messages
      path: /chat/messages
      operations:
      - name: getchatmessages
        method: GET
        description: List Chat Messages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: sendchatmessage
        method: POST
        description: Send Chat Message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: x-revert-api-token
      value: '{{env.REVERT_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: unified-chat-rest
    port: 8080
    description: REST adapter for Revert Unified API — Chat. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/chat/channels
      name: chat-channels
      description: REST surface for chat-channels.
      operations:
      - method: GET
        name: getchatchannels
        description: List Chat Channels
        call: unified-chat.getchatchannels
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/chat/messages
      name: chat-messages
      description: REST surface for chat-messages.
      operations:
      - method: GET
        name: getchatmessages
        description: List Chat Messages
        call: unified-chat.getchatmessages
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: sendchatmessage
        description: Send Chat Message
        call: unified-chat.sendchatmessage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: unified-chat-mcp
    port: 9090
    transport: http
    description: MCP adapter for Revert Unified API — Chat. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-chat-channels
      description: List Chat Channels
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: unified-chat.getchatchannels
      outputParameters:
      - type: object
        mapping: $.
    - name: list-chat-messages
      description: List Chat Messages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: unified-chat.getchatmessages
      outputParameters:
      - type: object
        mapping: $.
    - name: send-chat-message
      description: Send Chat Message
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: unified-chat.sendchatmessage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
