naftiko: 1.0.0-alpha2
info:
  label: Revert Unified API — CRM Users
  description: 'Revert Unified API — CRM Users. 3 operations. Lead operation: List CRM Users. Self-contained Naftiko capability
    covering one Revert business surface.'
  tags:
  - Revert
  - CRM Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    REVERT_API_KEY: REVERT_API_KEY
capability:
  consumes:
  - type: http
    namespace: unified-crm-users
    baseUri: https://api.revert.dev
    description: Revert Unified API — CRM Users business capability. Self-contained, no shared references.
    resources:
    - name: crm-users
      path: /crm/users
      operations:
      - name: getcrmusers
        method: GET
        description: List CRM Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createcrmuser
        method: POST
        description: Create CRM User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: crm-users-id
      path: /crm/users/{id}
      operations:
      - name: getcrmuser
        method: GET
        description: Get CRM User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: x-revert-api-token
      value: '{{env.REVERT_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: unified-crm-users-rest
    port: 8080
    description: REST adapter for Revert Unified API — CRM Users. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/crm/users
      name: crm-users
      description: REST surface for crm-users.
      operations:
      - method: GET
        name: getcrmusers
        description: List CRM Users
        call: unified-crm-users.getcrmusers
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createcrmuser
        description: Create CRM User
        call: unified-crm-users.createcrmuser
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/crm/users/{id}
      name: crm-users-id
      description: REST surface for crm-users-id.
      operations:
      - method: GET
        name: getcrmuser
        description: Get CRM User
        call: unified-crm-users.getcrmuser
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: unified-crm-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Revert Unified API — CRM Users. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-crm-users
      description: List CRM Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: unified-crm-users.getcrmusers
      outputParameters:
      - type: object
        mapping: $.
    - name: create-crm-user
      description: Create CRM User
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: unified-crm-users.createcrmuser
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-crm-user
      description: Get CRM User
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: unified-crm-users.getcrmuser
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
